# Checks the app on every pull request before it can go live (merging to
# main is going live): the strip and logic tests, then the site check (no
# missing files, no links starting with "/", and the page opens at phone and
# desktop width with no script error). .github/site-check.cjs is the same
# file as in Jose's other repos.
# A new page goes into the list on the last line.
name: Site check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned: Playwright 1.56.1 can't install its browser on Ubuntu 26.04,
    # which ubuntu-latest became in November 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Strip and logic tests (quick run)
        run: N=200 node tests/run.js
      - name: Install the browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check the site
        run: node .github/site-check.cjs index.html campus/index.html
